<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShopEasy - E-commerce</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>

    <!-- ===== Navbar ===== -->
  
    <nav>
        <div class="logo">ShopEasy</div>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#products">Products</a></li>
            <li><a href="#">Cart</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
     <!-- ===== Hero Section ===== -->
    <section class="hero">
        <h1>Big Sale is Live 🔥</h1>
        <p>Up to 50% OFF on all products</p>
        <button>Shop Now</button>
    </section>


    <!-- ===== Products Section ===== -->
    <section id="products" class="products">

        <h2>Our Products</h2>

        <div class="product-grid">

            <!-- Product 1 -->
            <div class="card">
                <img src="https://picsum.photos/200?1" alt="">
                <h3>Headphones</h3>
                <p class="price">₹999</p>
                <button>Add to Cart</button>
            </div>
             <!-- Product 2 -->
            <div class="card">
                <img src="https://picsum.photos/200?2" alt="">
                <h3>Shoes</h3>
                <p class="price">₹1499</p>
                <button>Add to Cart</button>
            </div>

            <!-- Product 3 -->
            <div class="card">
                <img src="https://picsum.photos/200?3" alt="">
                <h3>Smart Watch</h3>
                <p class="price">₹2499</p>
                <button>Add to Cart</button>
            </div>

            <!-- Product 4 -->
            <div class="card">
                <img src="https://picsum.photos/200?4" alt="">
                <h3>Backpack</h3>
                <p class="price">₹799</p>
                <button>Add to Cart</button>
                 </div>

            <!-- Product 5 -->
            <div class="card">
                <img src="https://picsum.photos/200?5" alt="">
                <h3>T-Shirt</h3>
                <p class="price">₹499</p>
                <button>Add to Cart</button>
            </div>

            <!-- Product 6 -->
            <div class="card">
                <img src="https://picsum.photos/200?6" alt="">
                <h3>Laptop Bag</h3>
                <p class="price">₹1199</p>
                <button>Add to Cart</button>
            </div>

        </div>
    </section>
     <!-- ===== Footer ===== -->
    <footer>
        <p>© 2026 ShopEasy | Designed by Rani ❤️</p>
    </footer>

</body>
</html>
