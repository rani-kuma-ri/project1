<!DOCTYPE html>
<html>
<head>
<style>
#title {
    color: blue;
}
</style>
</head>
<body>

<h1 id="title">Hello Rani</h1>
<button onclick="changeStyle()">Click Me</button>

<script>
function changeStyle() {
    document.getElementById("title").style.color = "green";
    document.getElementById("title").style.fontSize = "40px";
}
</script>

</body>
</html>
