<!DOCTYPE html>
<html>
<head>
    <title>Arrow Slider Website</title>
    <style>
        body{
            margin:0;
            font-family:Arial;
            background:#f2f2f2;
        }

        .slider{
            width:100%;
            height:100vh;
            position:relative;
            overflow:hidden;
        }

        input{
            display:none;
        }

        .slides{
            display:flex;
            width:300%;
            height:100%;
            transition:0.5s;
        }

        .slide{
            width:100%;
            height:100%;
            flex-shrink:0;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:40px;
            color:white;
        }

        .slide1{ background:#ff4d4d; }
        .slide2{ background:#4d79ff; }
        .slide3{ background:#28a745; }

        /* Arrow Buttons */
        .navigation label{
            position:absolute;
            top:50%;
            transform:translateY(-50%);
            font-size:40px;
            color:white;
            background:black;
            padding:10px 15px;
            cursor:pointer;
        }

        .left{ left:10px; }
        .right{ right:10px; }

        /* Slide movement */
        #slide1:checked ~ .slides{
            margin-left:0%;
        }

        #slide2:checked ~ .slides{
            margin-left:-100%;
        }

        #slide3:checked ~ .slides{
            margin-left:-200%;
        }
    </style>
</head>
<body>

<div class="slider">

    <input type="radio" name="slider" id="slide1" checked>
    <input type="radio" name="slider" id="slide2">
    <input type="radio" name="slider" id="slide3">

    <div class="slides">
        <div class="slide slide1">Welcome to My Website</div>
        <div class="slide slide2">About Us Page</div>
        <div class="slide slide3">Contact Us Page</div>
    </div>

    <div class="navigation">
        <label for="slide1" class="left">⬅</label>
        <label for="slide2" class="right">➡</label>
    </div>

</div>

</body>
</html>
